<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lust Taps</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f051a;
            --accent-purple: #7b2cbf;
            --accent-gold: #ffd700;
            --text-light: #e0aaff;
            --panel-bg: #1a0b2e;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Main Game Area */
        #game-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        #click-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle, #2d1252 0%, #0f051a 100%);
            cursor: pointer;
        }

        #score-display {
            position: absolute;
            top: 50px;
            text-align: center;
            pointer-events: none;
        }

        #score-count {
            font-size: 4rem;
            font-weight: 800;
            color: var(--accent-gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            display: block;
        }

        #cps-display {
            font-size: 1.2rem;
            color: var(--text-light);
            opacity: 0.8;
        }

        /* The Asset */
        #central-asset {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 8px solid var(--accent-purple);
            box-shadow: 0 0 50px var(--accent-purple);
            background-size: cover;
            background-position: center;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.5s;
            cursor: pointer;
            z-index: 10;
            /* Placeholder starting image */
            background-image: url('https://images.unsplash.com/photo-1581009146 ขึ้น-841-c7674-1000x1000?q=80&w=400&h=400&fit=crop'); 
        }

        #central-asset:active {
            transform: scale(0.92);
        }

        /* Shop Sidebar */
        #shop-sidebar {
            width: 400px;
            background-color: var(--panel-bg);
            border-left: 3px solid var(--accent-purple);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }

        .shop-header {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-gold);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .upgrade-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--accent-purple);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upgrade-item:hover {
            background: rgba(123, 44, 191, 0.2);
            transform: translateX(-5px);
        }

        .upgrade-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .upgrade-info h4 {
            margin: 0;
            color: var(--accent-gold);
            font-size: 1.1rem;
        }

        .upgrade-info p {
            margin: 0;
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .upgrade-cost {
            font-weight: 800;
            color: var(--accent-gold);
        }

        /* Particles */
        .particle {
            position: absolute;
            pointer-events: none;
            color: var(--accent-gold);
            font-weight: bold;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 800px) {
            #game-container { flex-direction: column; }
            #shop-sidebar { width: 100%; height: 50%; border-left: none; border-top: 3px solid var(--accent-purple); }
            #central-asset { width: 250px; height: 250px; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="click-area">
            <div id="score-display">
                <span id="score-count">0</span>
                <div id="cps-display">Generating 0.0 points/sec</div>
            </div>
            <div id="central-asset"></div>
        </div>

        <div id="shop-sidebar">
            <div class="shop-header">Pleasure Shop</div>
            <div id="upgrades-list">
                <!-- Upgrades injected by JS -->
            </div>
        </div>
    </div>

    <script>
        // GAME STATE
        let state = {
            points: 0,
            clickPower: 1,
            cps: 0,
            totalClicks: 0,
            upgrades: {
                stroker: { name: "Automatic Stroker", cost: 15, power: 0.5, count: 0, type: 'cps' },
                toy: { name: "Vibrating Toy", cost: 100, power: 3, count: 0, type: 'cps' },
                masseuse: { name: "Professional Masseuse", cost: 1100, power: 15, count: 0, type: 'cps' },
                sensory: { name: "Sensory Enhancement", cost: 50, power: 1, count: 0, type: 'click' },
                lube: { name: "Premium Lubrication", cost: 500, power: 10, count: 0, type: 'click' }
            }
        };

        // Visual Evolution Map (Milestone -> Image URL)
        const evolutions = [
            { threshold: 0, url: 'https://images.unsplash.com/photo-1509632964240-b483ef8d7545?q=80&w=400&h=400&fit=crop' }, // Soft/Suggestive
            { threshold: 1000, url: 'https://images.unsplash.com/photo-1515886651263-755d97797921?q=80&w=400&h=400&fit=crop' }, // More revealing
            { threshold: 10000, url: 'https://images.unsplash.com/photo-15520538B4-C47C-4B-1000x1000?q=80&w=400&h=400&fit=crop' }, // High erotic
            { threshold: 100000, url: 'https://images.unsplash.com/photo-1581009146-841-c7674-1000x1000?q=80&w=400&h=400&fit=crop' } // Peak Lust
        ];

        const assetEl = document.getElementById('central-asset');
        const scoreEl = document.getElementById('score-count');
        const cpsEl = document.getElementById('cps-display');
        const upgradesList = document.getElementById('upgrades-list');

        // INITIALIZATION
        function init() {
            loadGame();
            renderUpgrades();
            updateUI();
            startAutoLoop();
        }

        function updateUI() {
            scoreEl.innerText = Math.floor(state.points).toLocaleString();
            cpsEl.innerText = `Generating ${state.cps.toFixed(1)} points/sec`;
            
            // Handle Evolution
            const currentEvo = evolutions.slice().reverse().find(e => state.points >= e.threshold);
            assetEl.style.backgroundImage = `url('${currentEvo.url}')`;

            // Update buttons enabled state
            Object.keys(state.upgrades).forEach(id => {
                const btn = document.getElementById(`upg-${id}`);
                if (btn) {
                    const cost = state.upgrades[id].cost;
                    btn.classList.toggle('disabled', state.points < cost);
                }
            });
        }

        function renderUpgrades() {
            upgradesList.innerHTML = '';
            Object.keys(state.upgrades).forEach(id => {
                const upg = state.upgrades[id];
                const div = document.createElement('div');
                div.className = 'upgrade-item';
                div.id = `upg-${id}`;
                div.innerHTML = `
                    <div class="upgrade-info">
                        <h4>${upg.name}</h4>
                        <p>${upg.type === 'cps' ? '+'+upg.power+' pts/sec' : '+'+upg.power+' per click'}</p>
                    </div>
                    <div class="upgrade-cost">${Math.floor(upg.cost)} LP</div>
                `;
                div.onclick = () => buyUpgrade(id);
                upgradesList.appendChild(div);
            });
        }

        function buyUpgrade(id) {
            const upg = state.upgrades[id];
            if (state.points >= upg.cost) {
                state.points -= upg.cost;
                upg.count++;
                
                if (upg.type === 'cps') {
                    state.cps += upg.power;
                } else {
                    state.clickPower += upg.power;
                }

                upg.cost *= 1.15; // Price scaling
                saveGame();
                renderUpgrades();
                updateUI();
            }
        }

        // CLICK ACTION
        assetEl.onclick = (e) => {
            state.points += state.clickPower;
            state.totalClicks++;
            
            // Visual Feedback
            createParticle(e.clientX, e.clientY);
            updateUI();
        };

        function createParticle(x, y) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            p.innerText = `+${state.clickPower}`;
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 800);
        }

        // GAME LOOP
        function startAutoLoop() {
            setInterval(() => {
                state.points += state.cps / 10;
                updateUI();
            }, 100);
        }

        // STORAGE
        function saveGame() {
            localStorage.setItem('lustTapsSave', JSON.stringify(state));
        }

        function loadGame() {
            const saved = localStorage.getItem('lustTapsSave');
            if (saved) {
                const parsed = JSON.parse(saved);
                state = { ...state, ...parsed };
            }
        }

        // Auto-save every 30 seconds
        setInterval(saveGame, 30000);

        init();
    </script>
</body>
</html>
